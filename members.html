<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="rwa1X9lBSr5jx-eRLlUs0gUNB6Ztq5G5hIfJ8dgXLDE" />
  <title>ワイヤレスネットワーク研究室（濵村研究室） | Wireless Networking Laboratory</title>
  
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-white text-slate-800 font-sans antialiased selection:bg-brand-100 selection:text-brand-700">

  <!-- ================= HEADER / NAVIGATION ================= -->
  <div id="header-placeholder"></div>

  <!-- ================= CORE RESEARCH AREAS ================= -->
  <section class="py-20 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- セクションタイトル -->
      <div class="text-center max-w-2xl mx-auto mb-16">
        <h2 class="text-xs font-bold text-brand-600 tracking-widest uppercase mb-2">Members</h2>
        <p class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">愉快な仲間たち</p>
        <p class="text-slate-500 mt-3 text-base">研究室に所属している学生の紹介をしています．</p>
      </div>

    </div>
  </section>

  <!-- ================= MEMBER PROFILE ================= -->
  <section class="py-12 bg-white">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">

      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">

        <div class="grid grid-cols-1 md:grid-cols-3">

          <!-- 写真 -->
          <div class="md:col-span-1 bg-slate-50 flex items-center justify-center p-6">
            <div class="w-full max-w-xs aspect-[4/5] rounded-xl overflow-hidden bg-slate-200">
              <img
                src="images/members/member01.jpg"
                alt="メンバーの写真"
                class="w-full h-full object-cover"
              >
            </div>
          </div>

          <!-- プロフィール -->
          <div class="md:col-span-2 p-6 sm:p-8">

            <!-- 名前・所属 -->
            <div class="mb-6">
              <p class="text-xs font-bold text-brand-600 tracking-widest uppercase mb-2">
                Member Profile
              </p>

              <h3 class="text-2xl sm:text-3xl font-bold text-slate-900">
                山田 太郎
              </h3>

              <p class="text-sm text-slate-500 mt-1">
                Taro Yamada
              </p>

              <div class="flex flex-wrap items-center gap-2 mt-4">
                <span class="px-3 py-1 rounded-full bg-brand-50 text-brand-700 text-xs font-semibold">
                  修士 / Master's
                </span>
                <span class="px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-semibold">
                  M1
                </span>
              </div>
            </div>

            <div class="border-t border-slate-100 pt-6 space-y-5">

              <!-- 研究テーマ -->
              <div>
                <h4 class="text-sm font-bold text-slate-800 mb-2">
                  <span class="mr-2 text-brand-600">●</span>
                  研究テーマ / Research
                </h4>
                <p class="text-sm text-slate-600 leading-relaxed">
                  ここに研究テーマを記入します。
                  研究内容や目的などを簡潔に紹介します。
                </p>
              </div>

              <!-- 趣味 -->
              <div>
                <h4 class="text-sm font-bold text-slate-800 mb-2">
                  <span class="mr-2 text-brand-600">●</span>
                  趣味 / Hobbies
                </h4>
                <p class="text-sm text-slate-600">
                  旅行、映画鑑賞、ゲーム
                </p>
              </div>

              <!-- その他 -->
              <div>
                <h4 class="text-sm font-bold text-slate-800 mb-2">
                  <span class="mr-2 text-brand-600">●</span>
                  その他 / Others
                </h4>
                <p class="text-sm text-slate-600">
                  所属サークル、資格、特技など
                </p>
              </div>

              <!-- メッセージ -->
              <div>
                <h4 class="text-sm font-bold text-slate-800 mb-2">
                  <span class="mr-2 text-brand-600">●</span>
                  メッセージ / Messege
                </h4>
                <p class="text-sm text-slate-600">
                  メッセージ
                </p>
              </div>

            </div>

          </div>
        </div>
      </div>

    </div>
  </section>
  <!-- ================= END MEMBER PROFILE ================= -->


  <!-- ================= FOOTER ================= -->
  <div id="footer-placeholder"></div>

  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
